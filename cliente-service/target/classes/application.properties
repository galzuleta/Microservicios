# =============================================
#  CLIENTE-SERVICE - application.properties
# =============================================

# Puerto del microservicio
server.port=8081

# Nombre del servicio (con el que se registra en Eureka)
spring.application.name=cliente

# ---- Base de datos H2 en memoria ----
spring.datasource.url=jdbc:h2:mem:clientesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 accesible en http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Eureka ----
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Muestra la IP en vez del hostname (evita errores de resolución DNS en local)
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
